# Caddy config for mynaelo.com
# ================================================
# Для адміна:
#   cp /srv/apps/luma-64/api/caddy.conf /etc/caddy/sites/mynaelo.conf
#   systemctl reload caddy
# ================================================

mynaelo.com, www.mynaelo.com {

    encode zstd gzip

    redir /privacy/ /privacy 308
    redir /policy/ /policy 308
    redir /delete-account/ /delete-account 308

    # AI API → Node.js on port 8012
    handle /ai/* {
        reverse_proxy 127.0.0.1:8012
    }

    handle /health {
        reverse_proxy 127.0.0.1:8012
    }

    # Static HTML pages → /srv/apps/luma-64/web/
    handle /privacy {
        rewrite * /privacy.html
        root * /srv/apps/luma-64/web
        header Cache-Control "no-cache, must-revalidate"
        file_server
    }

    handle /policy {
        rewrite * /policy.html
        root * /srv/apps/luma-64/web
        header Cache-Control "no-cache, must-revalidate"
        file_server
    }

    handle /delete-account {
        rewrite * /delete-account.html
        root * /srv/apps/luma-64/web
        header Cache-Control "no-cache, must-revalidate"
        file_server
    }

    # Expo mobile dev server → port 3007
    handle {
        reverse_proxy 127.0.0.1:3007
    }

    @static path *.js *.css *.png *.jpg *.svg *.json *.ico *.woff2 *.ttf *.mp4
    header @static Cache-Control "public, max-age=31536000, immutable"

    header {
        defer
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "SAMEORIGIN"
        Referrer-Policy "strict-origin-when-cross-origin"
    }

    log {
        output file /var/log/caddy/naelo.log {
            roll_size 10MB
            roll_keep 5
        }
        format json
    }
}
