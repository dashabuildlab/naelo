# Caddy config for mynaelo.com
# Place at: /etc/caddy/sites/naelo.conf
# Requires: A record @ → 89.167.40.15 (already done)
# Reload: systemctl reload caddy

mynaelo.com, www.mynaelo.com {
    encode zstd gzip

    # API routes → Node.js on port 8012
    handle /ai/* {
        reverse_proxy 127.0.0.1:8012
    }

    handle /health {
        reverse_proxy 127.0.0.1:8012
    }

    # Web app → Docker on port 3007
    handle {
        reverse_proxy 127.0.0.1:3007
    }

    @static path *.js *.css *.png *.jpg *.svg *.json *.ico *.woff2 *.ttf *.mp4
    header @static Cache-Control "public, max-age=31536000, immutable"

    header {
        defer
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "SAMEORIGIN"
        Referrer-Policy "strict-origin-when-cross-origin"
    }

    log {
        output file /var/log/caddy/naelo.log {
            roll_size 10MB
            roll_keep 5
        }
        format json
    }
}
